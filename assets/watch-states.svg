<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="1200" height="420" role="img" aria-label="手表三种表情状态：待机、聆听、播报">
  <defs>
    <style>
      .h{font-family:"Helvetica Neue",Helvetica,"Hiragino Sans","PingFang SC","Microsoft YaHei",sans-serif}
      .m{font-family:"SF Mono",Consolas,"Liberation Mono",monospace}
    </style>
  </defs>

  <rect width="1200" height="420" fill="#f6f4ee"/>
  <text x="60" y="48" class="m" font-size="11" letter-spacing="2.5" fill="#8d887e">EXPRESSION STATE MACHINE · 03 STATES</text>
  <line x1="60" y1="62" x2="1140" y2="62" stroke="#ded9cd"/>

  <!-- 待机 -->
  <g transform="translate(200 190)">
    <circle r="112" fill="none" stroke="#ded9cd" stroke-width="1"/>
    <circle r="98" fill="#fbfaf6" stroke="#2f2d29" stroke-width="1.5"/>
    <!-- 半睁眼 -->
    <g fill="#2f2d29">
      <path d="M-54 -4 q18 -4 34 0 q-16 12 -34 0z"/>
      <path d="M20 -4 q18 -4 34 0 q-16 12 -34 0z"/>
    </g>
    <text x="0" y="66" class="m" font-size="9.5" fill="#8d887e" text-anchor="middle">IDLE</text>
  </g>
  <text x="200" y="336" class="h" font-size="15" font-weight="600" fill="#2f2d29" text-anchor="middle">待机</text>
  <text x="200" y="362" class="h" font-size="12" fill="#8d887e" text-anchor="middle">眼睛半睁 · 缓慢东张西望</text>

  <!-- 聆听 -->
  <g transform="translate(600 190)">
    <circle r="112" fill="none" stroke="#ded9cd" stroke-width="1"/>
    <circle r="98" fill="#fbfaf6" stroke="#2f2d29" stroke-width="1.5"/>
    <!-- 放大眼 + 瞳孔朝侧 -->
    <g>
      <ellipse cx="-36" cy="-6" rx="21" ry="25" fill="#fff" stroke="#ded9cd" stroke-width="1"/>
      <ellipse cx="36" cy="-6" rx="21" ry="25" fill="#fff" stroke="#ded9cd" stroke-width="1"/>
      <ellipse cx="-31" cy="-4" rx="12" ry="17" fill="#2f2d29"/>
      <ellipse cx="41" cy="-4" rx="12" ry="17" fill="#2f2d29"/>
      <circle cx="-35" cy="-11" r="4.5" fill="#fff"/><circle cx="37" cy="-11" r="4.5" fill="#fff"/>
    </g>
    <!-- 声波 -->
    <g stroke="#8d887e" stroke-width="1.5" fill="none" stroke-linecap="round">
      <path d="M-82 34 q-9 -7 -16 0 M-82 46 q-14 -11 -24 0"/>
      <path d="M82 34 q9 -7 16 0 M82 46 q14 -11 24 0"/>
    </g>
    <text x="0" y="66" class="m" font-size="9.5" fill="#8d887e" text-anchor="middle">LISTENING</text>
  </g>
  <text x="600" y="336" class="h" font-size="15" font-weight="600" fill="#2f2d29" text-anchor="middle">聆听</text>
  <text x="600" y="362" class="h" font-size="12" fill="#8d887e" text-anchor="middle">眼睛放大 · 瞳孔朝声源</text>

  <!-- 播报 -->
  <g transform="translate(1000 190)">
    <circle r="112" fill="none" stroke="#ded9cd" stroke-width="1"/>
    <circle r="98" fill="#fbfaf6" stroke="#2f2d29" stroke-width="1.5"/>
    <!-- 眯眼笑 -->
    <g stroke="#2f2d29" stroke-width="2.5" fill="none" stroke-linecap="round">
      <path d="M-54 -8 q16 14 34 0"/><path d="M20 -8 q16 14 34 0"/>
    </g>
    <path d="M-12 26 q12 10 24 0" fill="none" stroke="#9c4a35" stroke-width="2" stroke-linecap="round"/>
    <rect x="-62" y="44" width="124" height="22" fill="#fbfaf6" stroke="#9c4a35" stroke-width="1"/>
    <text x="0" y="59" class="h" font-size="10" font-weight="600" fill="#9c4a35" text-anchor="middle">播报中</text>
  </g>
  <text x="1000" y="336" class="h" font-size="15" font-weight="600" fill="#2f2d29" text-anchor="middle">播报</text>
  <text x="1000" y="362" class="h" font-size="12" fill="#8d887e" text-anchor="middle">看向人脸 · 句末眨眼</text>

  <line x1="60" y1="398" x2="1140" y2="398" stroke="#ded9cd"/>
</svg>
