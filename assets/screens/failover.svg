<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 340" width="900" height="340" role="img" aria-label="本机云端主备流程">
<rect width="900" height="340" fill="#f6f4ee"/>
<rect x="12" y="12" width="876" height="316" fill="none" stroke="#ded9cd" stroke-width="1"/>
<line x1="28" y1="30" x2="84" y2="30" stroke="#2f2d29" stroke-width="1"/>
<text x="450" y="48" text-anchor="middle" font-family="'Microsoft YaHei','PingFang SC',sans-serif" font-size="18" font-weight="500" fill="#2f2d29">本机全量生产 · 云端待命接管</text>
<rect x="40" y="150" width="130" height="72" fill="#fbfaf6" stroke="#2f2d29" stroke-width="1.5"/>
<text x="105" y="182" text-anchor="middle" font-family="'Microsoft YaHei','PingFang SC',sans-serif" font-size="14" fill="#2f2d29">手表 / 手机</text>
<text x="105" y="204" text-anchor="middle" font-family="ui-monospace,Consolas,monospace" font-size="10" fill="#8d887e">设备轮询</text>
<rect x="300" y="110" width="240" height="112" fill="#fbfaf6" stroke="#2f2d29" stroke-width="1.5"/>
<text x="420" y="146" text-anchor="middle" font-family="'Microsoft YaHei','PingFang SC',sans-serif" font-size="16" font-weight="600" fill="#9c4a35">本机 owner</text>
<text x="420" y="172" text-anchor="middle" font-family="ui-monospace,Consolas,monospace" font-size="11" fill="#57534c">localAll=true · 家用内网地址</text>
<text x="420" y="196" text-anchor="middle" font-family="'Microsoft YaHei','PingFang SC',sans-serif" font-size="11" fill="#57534c">在线即抑制云端 4 处生产</text>
<rect x="650" y="150" width="210" height="72" fill="#fbfaf6" stroke="#2f2d29" stroke-width="1.5"/>
<text x="755" y="182" text-anchor="middle" font-family="'Microsoft YaHei','PingFang SC',sans-serif" font-size="14" fill="#2f2d29">云端 standby</text>
<text x="755" y="204" text-anchor="middle" font-family="ui-monospace,Consolas,monospace" font-size="10" fill="#8d887e">standbyRole=true</text>
<path d="M170 186 L292 166" stroke="#57534c" stroke-width="1.5" fill="none" marker-end="url(#ar)"/>
<defs><marker id="ar" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#57534c"/></marker></defs>
<path d="M540 150 Q600 96 650 150" stroke="#57534c" stroke-width="1.5" fill="none" stroke-dasharray="5 4" marker-end="url(#ar)"/>
<text x="596" y="102" text-anchor="middle" font-family="'Microsoft YaHei','PingFang SC',sans-serif" font-size="10.5" fill="#57534c">心跳 10s (带 maxId)</text>
<rect x="290" y="250" width="320" height="56" fill="none" stroke="#ded9cd" stroke-width="1"/>
<text x="450" y="274" text-anchor="middle" font-family="'Microsoft YaHei','PingFang SC',sans-serif" font-size="11.5" fill="#57534c">60s 无心跳 → 云端接管播报与播放</text>
<text x="450" y="294" text-anchor="middle" font-family="'Microsoft YaHei','PingFang SC',sans-serif" font-size="11.5" fill="#57534c">本机回来 → 让位并回灌新增消息（不覆盖文件）</text>
<path d="M755 222 Q700 290 610 278" stroke="#57534c" stroke-width="1.5" fill="none" stroke-dasharray="5 4" marker-end="url(#ar)"/>
</svg>