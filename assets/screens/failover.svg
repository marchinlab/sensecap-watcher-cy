<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 340" width="900" height="340" role="img" aria-label="本机云端主备流程">
<defs><linearGradient id="fbg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fff6fb"/><stop offset="55%" stop-color="#f8f7ff"/><stop offset="100%" stop-color="#eff9ff"/></linearGradient>
<linearGradient id="frim" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#ff6b9d"/><stop offset="55%" stop-color="#8a7bf7"/><stop offset="100%" stop-color="#3fb6e8"/></linearGradient></defs>
<rect width="900" height="340" fill="url(#fbg)"/>
<rect x="10" y="10" width="880" height="320" rx="18" fill="#ffffff" fill-opacity=".72" stroke="#eedef0" stroke-width="1.5"/>
<rect x="28" y="28" width="60" height="6" rx="3" fill="url(#frim)"/>
<text x="450" y="46" text-anchor="middle" font-family="'Microsoft YaHei','PingFang SC',sans-serif" font-size="19" font-weight="bold" fill="#33294a">✦ 本机全量生产 · 云端待命接管</text>
<rect x="40" y="150" width="130" height="72" rx="12" fill="#2f6b62"/>
<text x="105" y="182" text-anchor="middle" font-family="'Microsoft YaHei','PingFang SC',sans-serif" font-size="15" fill="#fff">手表 / 手机</text>
<text x="105" y="204" text-anchor="middle" font-family="ui-monospace,Consolas,monospace" font-size="11" fill="#cfe6e0">设备轮询</text>
<rect x="300" y="110" width="240" height="112" rx="14" fill="#b4562f"/>
<text x="420" y="146" text-anchor="middle" font-family="'Microsoft YaHei','PingFang SC',sans-serif" font-size="17" font-weight="bold" fill="#fff">本机 owner</text>
<text x="420" y="172" text-anchor="middle" font-family="ui-monospace,Consolas,monospace" font-size="12" fill="#ffe6d0">localAll=true · 家用内网地址</text>
<text x="420" y="196" text-anchor="middle" font-family="'Microsoft YaHei','PingFang SC',sans-serif" font-size="12" fill="#ffe6d0">在线即抑制云端 4 处生产</text>
<rect x="650" y="150" width="210" height="72" rx="12" fill="#35507a"/>
<text x="755" y="182" text-anchor="middle" font-family="'Microsoft YaHei','PingFang SC',sans-serif" font-size="15" fill="#fff">云端 standby</text>
<text x="755" y="204" text-anchor="middle" font-family="ui-monospace,Consolas,monospace" font-size="11" fill="#cfe0f5">standbyRole=true</text>
<path d="M170 186 L292 166" stroke="#5d5347" stroke-width="2" fill="none" marker-end="url(#ar)"/>
<defs><marker id="ar" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#5d5347"/></marker></defs>
<path d="M540 150 Q600 96 650 150" stroke="#2f6b62" stroke-width="2" fill="none" stroke-dasharray="5 4" marker-end="url(#ar)"/>
<text x="596" y="102" text-anchor="middle" font-family="'Microsoft YaHei','PingFang SC',sans-serif" font-size="11" fill="#2f6b62">心跳 10s (带 maxId)</text>
<rect x="290" y="250" width="320" height="56" rx="12" fill="#fff0f7" stroke="#f3d3e4"/>
<text x="450" y="274" text-anchor="middle" font-family="'Microsoft YaHei','PingFang SC',sans-serif" font-size="12" fill="#574c70">60s 无心跳 → 云端接管播报与播放</text>
<text x="450" y="294" text-anchor="middle" font-family="'Microsoft YaHei','PingFang SC',sans-serif" font-size="12" fill="#574c70">本机回来 → 让位并回灌新增消息（不覆盖文件）</text>
<path d="M755 222 Q700 290 610 278" stroke="#35507a" stroke-width="2" fill="none" stroke-dasharray="5 4" marker-end="url(#ar)"/>
</svg>