<text x="331" y="302" font-family="'Microsoft YaHei','PingFang SC',sans-serif" font-size="11" fill="#574c70">按名字找到同名任务，立刻按它的 prompt 执行一次</text>
<rect x="600" y="248" width="270" height="76" rx="12" fill="#fff0f7" stroke="#f3d3e4"/>
<text x="616" y="276" font-family="'Microsoft YaHei','PingFang SC',sans-serif" font-size="14" font-weight="bold" fill="#ff6b9d">③ 问进度 / 列工作流</text>
<text x="616" y="302" font-family="'Microsoft YaHei','PingFang SC',sans-serif" font-size="11" fill="#574c70">status 念结果；list_flows 实时读 SQLite 列最新 5 条</text>
<text x="450" y="354" text-anchor="middle" font-family="'Microsoft YaHei','PingFang SC',sans-serif" font-size="11" fill="#9a8fb0">为什么用文件队列：桌面端无稳定对外 API，本地 MCP token 绑会话会过期——文件最耐长跑</text>
