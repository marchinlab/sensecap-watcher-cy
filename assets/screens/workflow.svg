<linearGradient id="wrim" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#ff6b9d"/><stop offset="55%" stop-color="#8a7bf7"/><stop offset="100%" stop-color="#3fb6e8"/></linearGradient></defs>
