<text x="787" y="124" text-anchor="middle" font-family="'Microsoft YaHei','PingFang SC',sans-serif" font-size="15" font-weight="bold" fill="#fff">WorkBuddy 电脑端</text>
<text x="787" y="148" text-anchor="middle" font-family="'Microsoft YaHei','PingFang SC',sans-serif" font-size="11" fill="#f2e8d3">automation 每小时消费</text>
<path d="M195 130 L247 130" stroke="#5d5347" stroke-width="2" fill="none" marker-end="url(#aw)"/>
