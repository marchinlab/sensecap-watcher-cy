<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 440" width="1200" height="440" role="img" aria-label="SenseCAP Watcher CY 定制版 项目横幅">
  <defs>
    <style>
      .h{font-family:"Helvetica Neue",Helvetica,"Hiragino Sans","PingFang SC","Microsoft YaHei",sans-serif}
      .m{font-family:"SF Mono",Consolas,"Liberation Mono",monospace}
    </style>
  </defs>

  <!-- 温润米白底 -->
  <rect width="1200" height="440" fill="#f6f4ee"/>

  <!-- kicker -->
  <text x="72" y="66" class="m" font-size="11" letter-spacing="3" fill="#8d887e">SENSECAP WATCHER · CY EDITION · CHANGELOG</text>

  <!-- 主标题 -->
  <text x="72" y="158" class="h" font-size="58" font-weight="500" fill="#2f2d29">一块手表，</text>
  <text x="72" y="234" class="h" font-size="58" font-weight="500" fill="#57534c">四十多个固件版本</text>

  <!-- 副标题 -->
  <text x="74" y="288" class="h" font-size="17" fill="#57534c">给一块 ESP32-S3 圆屏手表装上会看人、会播报、会记事的私人 AI 管家</text>

  <!-- 数据 · 细线排列 -->
  <g class="m" font-size="11.5" fill="#8d887e">
    <line x1="72" y1="322" x2="632" y2="322" stroke="#ded9cd"/>
    <text x="72" y="352">ESP32-S3</text>
    <text x="196" y="352">LVGL</text>
    <text x="272" y="352">NODE.JS</text>
    <text x="372" y="352">MCP × 37</text>
    <text x="484" y="352">40+ RELEASES</text>
  </g>

  <!-- 标签 · 细线框 -->
  <g class="h" font-size="12" font-weight="600">
    <rect x="72" y="380" width="110" height="32" fill="none" stroke="#2f2d29"/>
    <text x="127" y="401" text-anchor="middle" fill="#2f2d29">自研固件</text>
    <rect x="194" y="380" width="122" height="32" fill="none" stroke="#2f2d29"/>
    <text x="255" y="401" text-anchor="middle" fill="#2f2d29">自建服务端</text>
    <rect x="328" y="380" width="122" height="32" fill="none" stroke="#9c4a35"/>
    <text x="389" y="401" text-anchor="middle" fill="#9c4a35">端到端可控</text>
  </g>

  <!-- 右侧：极简圆屏（细线，无角色） -->
  <g transform="translate(950 220)">
    <circle r="164" fill="none" stroke="#ded9cd" stroke-width="1"/>
    <circle r="150" fill="none" stroke="#2f2d29" stroke-width="1.5"/>
    <circle r="132" fill="#fbfaf6" stroke="#ded9cd" stroke-width="1"/>
    <g stroke="#ded9cd" stroke-width="1" opacity=".8">
      <line x1="-132" y1="0" x2="132" y2="0"/><line x1="0" y1="-132" x2="0" y2="132"/>
    </g>
    <circle r="88" fill="none" stroke="#ded9cd" stroke-width="1"/>
    <circle r="44" fill="none" stroke="#ded9cd" stroke-width="1"/>
    <rect x="-52" y="-24" width="34" height="40" fill="none" stroke="#2f2d29" stroke-width="1.5"/>
    <rect x="18" y="-24" width="34" height="40" fill="none" stroke="#2f2d29" stroke-width="1.5"/>
    <rect x="-42" y="-12" width="10" height="16" fill="#2f2d29"/>
    <rect x="32" y="-12" width="10" height="16" fill="#2f2d29"/>
    <line x1="-60" y1="58" x2="60" y2="58" stroke="#9c4a35" stroke-width="2"/>
    <text x="0" y="80" class="m" font-size="10" fill="#8d887e" text-anchor="middle" letter-spacing="1">播报 · 早报 03</text>
    <text x="-112" y="-96" class="m" font-size="9" fill="#8d887e">01 / 37</text>
    <text x="112" y="-96" class="m" font-size="9" fill="#8d887e" text-anchor="end">LIVE</text>
  </g>

  <!-- 底部基线 -->
  <line x1="72" y1="432" x2="1128" y2="432" stroke="#2f2d29" stroke-width="1"/>
  <text x="72" y="450" class="m" font-size="9.5" letter-spacing="1.2" fill="#8d887e">2026 — PERSONAL PROJECT · EVERY VERSION REVERTIBLE</text>
</svg>
