<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 480" width="1200" height="480" role="img" aria-label="SenseCAP Watcher CY 定制版 项目横幅">
  <defs>
    <style>
      .h{font-family:"Helvetica Neue",Helvetica,Arial,"PingFang SC","Microsoft YaHei",sans-serif}
      .m{font-family:"SF Mono",Consolas,"Liberation Mono",monospace}
    </style>
  </defs>

  <!-- 白底 + 细网格 -->
  <rect width="1200" height="480" fill="#ffffff"/>
  <g stroke="#e6e6e2" stroke-width="1">
    <path d="M0 80H1200M0 160H1200M0 240H1200M0 320H1200M0 400H1200"/>
    <path d="M120 0V480M240 0V480M360 0V480M480 0V480M600 0V480M720 0V480M840 0V480M960 0V480M1080 0V480"/>
  </g>

  <!-- 顶部红色标尺 -->
  <rect x="0" y="0" width="1200" height="6" fill="#e2231a"/>
  <rect x="0" y="0" width="180" height="6" fill="#111111"/>

  <!-- kicker -->
  <rect x="72" y="54" width="24" height="8" fill="#e2231a"/>
  <text x="108" y="63" class="m" font-size="12" letter-spacing="2.4" font-weight="700" fill="#e2231a">SENSECAP WATCHER · CY EDITION · CHANGELOG</text>

  <!-- 主标题 -->
  <text x="72" y="150" class="h" font-size="62" font-weight="800" letter-spacing="-2" fill="#111111">一块手表，</text>
  <text x="72" y="226" class="h" font-size="62" font-weight="800" letter-spacing="-2" fill="#111111">四十多个</text>
  <text x="424" y="226" class="h" font-size="62" font-weight="800" letter-spacing="-2" fill="#e2231a">固件版本</text>

  <!-- 副标题 -->
  <text x="74" y="278" class="h" font-size="20" fill="#3c3c3c">给一块 ESP32-S3 圆屏手表装上会看人、会播报、会记事的私人 AI 管家</text>

  <!-- 数据条 -->
  <g class="m" font-size="12" fill="#3c3c3c">
    <rect x="72" y="316" width="520" height="1" fill="#111111"/>
    <text x="72" y="344">ESP32-S3</text>
    <text x="196" y="344">LVGL</text>
    <text x="272" y="344">NODE.JS</text>
    <text x="372" y="344">MCP × 37</text>
    <text x="484" y="344">40+ RELEASES</text>
  </g>

  <!-- 标签 -->
  <g class="m" font-size="11" letter-spacing="1.2" font-weight="700">
    <rect x="72" y="376" width="112" height="32" fill="#111111"/>
    <text x="84" y="397" fill="#ffffff">自研固件</text>
    <rect x="196" y="376" width="124" height="32" fill="#111111"/>
    <text x="208" y="397" fill="#ffffff">自建服务端</text>
    <rect x="332" y="376" width="124" height="32" fill="#e2231a"/>
    <text x="344" y="397" fill="#ffffff">端到端可控</text>
  </g>

  <!-- 右侧：几何手表（瑞士风 - 红黑白） -->
  <g transform="translate(940 240)">
    <circle r="176" fill="#ffffff" stroke="#111111" stroke-width="3"/>
    <circle r="160" fill="none" stroke="#e6e6e2" stroke-width="1"/>
    <circle r="146" fill="#111111"/>
    <g stroke="#3c3c3c" stroke-width="1" opacity=".55">
      <path d="M-146 0H146M0 -146V146"/>
    </g>
    <circle r="96" fill="none" stroke="#3c3c3c" stroke-width="1" opacity=".5"/>
    <circle r="52" fill="none" stroke="#3c3c3c" stroke-width="1" opacity=".35"/>
    <rect x="-62" y="-30" width="44" height="60" fill="#ffffff"/>
    <rect x="18" y="-30" width="44" height="60" fill="#ffffff"/>
    <rect x="-50" y="-14" width="16" height="30" fill="#e2231a"/>
    <rect x="30" y="-14" width="16" height="30" fill="#e2231a"/>
    <rect x="-88" y="72" width="176" height="30" fill="#e2231a"/>
    <text x="0" y="92" class="m" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle" letter-spacing="1">播报 · 早报 03</text>
    <text x="-130" y="-108" class="m" font-size="10" fill="#8c8c8c">01 / 37</text>
    <text x="130" y="-108" class="m" font-size="10" fill="#8c8c8c" text-anchor="end">LIVE</text>
  </g>

  <!-- 底部基线 -->
  <rect x="72" y="446" width="1056" height="1" fill="#111111"/>
  <text x="72" y="466" class="m" font-size="10" letter-spacing="1.4" fill="#8c8c8c">2026 — PERSONAL PROJECT · EVERY VERSION REVERTIBLE</text>
</svg>
